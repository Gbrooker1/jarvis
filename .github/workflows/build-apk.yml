name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: |
          set +e
          flutter build apk --release > "$GITHUB_WORKSPACE/build.log" 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::Flutter build failed with exit code $STATUS. Log tail:"
            tail -40 "$GITHUB_WORKSPACE/build.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          echo "Build succeeded."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
